spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/store
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      url: /openapi.yaml