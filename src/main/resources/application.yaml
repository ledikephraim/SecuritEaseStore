spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/store
    username: admin
    password: admin
    hikari:
      maximum-pool-size: 10
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      url: /openapi.yaml