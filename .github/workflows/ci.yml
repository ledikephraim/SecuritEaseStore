name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, format check, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs compileJava, spotlessCheck (formatting gate), and the unit/controller test suite.
      - name: Build
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  db-smoke-test:
    name: Boot against a real database
    runs-on: ubuntu-latest
    needs: build
    # None of this job's checks are covered by the unit tests above, which mock every
    # repository. Every one of these is a bug we actually hit running this app manually:
    # a JPQL tuple-projection that only fails once Hibernate executes it for real, a
    # sequence desynced from seeded data, a Liquibase checksum mismatch, a springdoc/Spring
    # version incompatibility that only surfaces once a @ControllerAdvice bean exists, and
    # entity code committed with no migration ever creating its table. A green unit test
    # suite would not have caught any of them; only a real boot against a real database does.
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Start application against Postgres
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/store
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-plain.jar")
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/customers/1 > /dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          cat app.log
          exit 1

      - name: Smoke-test core endpoints against real data
        run: |
          set -e

          echo "GET /customers returns a page"
          curl -sf http://localhost:8080/customers | grep -q '"content"'

          echo "GET /customers/1 returns seeded data"
          curl -sf http://localhost:8080/customers/1 | grep -q 'Muriel Donnelly'

          echo "GET /customers/999999999 returns 404, not 500"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/customers/999999999)" = "404"

          echo "GET /orders returns a page"
          curl -sf http://localhost:8080/orders | grep -q '"content"'

          echo "GET /orders/1 includes customer details"
          curl -sf http://localhost:8080/orders/1 | grep -q '"customer"'

          echo "GET /v3/api-docs succeeds (regression check for the springdoc/ControllerAdvice incompatibility)"
          curl -sf http://localhost:8080/v3/api-docs | grep -q '"openapi"'

          echo "GET /swagger-ui/index.html succeeds"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/swagger-ui/index.html)" = "200"

          echo "POST /products creates a product"
          PRODUCT_ID=$(curl -sf -X POST http://localhost:8080/products \
            -H "Content-Type: application/json" \
            -d '{"description":"CI Smoke Test Product"}' | jq -r '.id')
          test -n "$PRODUCT_ID" && test "$PRODUCT_ID" != "null"

          echo "POST /orders creates an order carrying that product"
          curl -sf -X POST http://localhost:8080/orders \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"CI Smoke Test Order\",\"customerId\":1,\"productIds\":[$PRODUCT_ID]}" \
            | grep -q "CI Smoke Test Product"

      - name: Show application logs on failure
        if: failure()
        run: cat app.log || true

      - name: Stop application
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true
